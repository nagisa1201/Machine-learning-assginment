version: '3.8'

# 1. 定义公共环境变量
x-common-env: &common_env
  DISPLAY: ${DISPLAY}
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: all
  OMP_WAIT_POLICY: passive
  TERM: xterm-256color

# 2. 定义公共配置
x-common: &common
  tty: true
  network_mode: host
  pid: "host"
  ipc: "host"
  privileged: true
  user: "Nagisa"
  stdin_open: true

services:
  machine-learning-service:
    # build:
    #   context: ..
    #   dockerfile: .devcontainer/Dockerfile
    image: nagisa/machine-learning:latest
    container_name: machine-learning_dev
    <<: *common
    environment:
      <<: *common_env
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/dev
      - ..:/home/Nagisa/Machine-learning-assginment

    # 容器启动后，默认直接进入挂载的代码目录
    working_dir: "/home/Nagisa/Machine-learning-assginment"
    entrypoint:
      - /bin/bash
